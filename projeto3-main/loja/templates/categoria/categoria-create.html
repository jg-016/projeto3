{% extends 'loja/base.html' %}

{% block title %}Nova Categoria - Loja{% endblock %}

{% block content %}
  <h1>Nova Categoria</h1>
  <form method="post" action="{% url 'categoria_create' %}">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Nome</label>
      <input class="form-control" name="categoria" value="">
    </div>
    <button class="btn btn-success">Inserir</button>
  </form>
{% endblock %}
